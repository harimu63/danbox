<%+header%>

<h2 name="content">DanBox - Editor</h2>
<div class="cbi-map-descr">Browse and edit files directly inside the sing-box config directory.</div>

<div style="display:flex; gap:16px; align-items:flex-start">
	<div class="cbi-section" style="width:260px">
		<h3>Files</h3>
		<ul id="db_filelist" style="list-style:none; margin:0; padding:0"></ul>
	</div>

	<div class="cbi-section" style="flex:1">
		<h3 id="db_editor_title">Select a file</h3>
		<textarea id="db_editor" style="width:100%; height:480px; font-family:monospace; font-size:13px"></textarea>
		<div class="cbi-page-actions">
			<button class="cbi-button cbi-button-save" onclick="dbSaveFile()">Save</button>
			<button class="cbi-button" onclick="dbReloadFile()">Reload</button>
		</div>
	</div>
</div>

<script type="text/javascript">
	var dbUrl = {
		list: '<%=luci.dispatcher.build_url("admin/services/danbox/file_list")%>',
		get:  '<%=luci.dispatcher.build_url("admin/services/danbox/file_get")%>',
		save: '<%=luci.dispatcher.build_url("admin/services/danbox/file_save")%>'
	};
	var dbCurrentFile = null;

	function dbLoadList() {
		fetch(dbUrl.list).then(r => r.json()).then(function(d) {
			var ul = document.getElementById('db_filelist');
			ul.innerHTML = '';
			(d.files || []).forEach(function(f) {
				var li = document.createElement('li');
				li.textContent = f.name + (f.is_dir ? '/' : '');
				li.style.cursor = f.is_dir ? 'default' : 'pointer';
				li.style.padding = '4px 0';
				li.style.color = f.is_dir ? '#888' : '#2266cc';
				if (!f.is_dir) {
					li.onclick = function() { dbOpenFile(f.name); };
				}
				ul.appendChild(li);
			});
		});
	}

	function dbOpenFile(name) {
		dbCurrentFile = name;
		document.getElementById('db_editor_title').textContent = name;
		fetch(dbUrl.get + '?name=' + encodeURIComponent(name)).then(r => r.json()).then(function(d) {
			document.getElementById('db_editor').value = d.ok ? d.content : ('// error: ' + d.msg);
		});
	}

	function dbReloadFile() {
		if (dbCurrentFile) dbOpenFile(dbCurrentFile);
	}

	function dbSaveFile() {
		if (!dbCurrentFile) { alert('No file selected'); return; }
		var body = new FormData();
		body.append('name', dbCurrentFile);
		body.append('content', document.getElementById('db_editor').value);
		fetch(dbUrl.save, { method: 'POST', body: body }).then(r => r.json()).then(function(d) {
			alert(d.ok ? 'Saved.' : 'Save failed.');
		});
	}

	dbLoadList();
</script>

<%+footer%>
