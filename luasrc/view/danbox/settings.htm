<%+header%>

<h2 name="content">DanBox - Settings</h2>
<div class="cbi-map-descr">Pengaturan Transparent Proxy dan Dashboard.</div>

<div class="cbi-section">
	<h3>Transparent Proxy (nftables tproxy)</h3>
	<table class="table" style="max-width:700px">
		<tr class="tr"><td class="td left" style="width:280px"><label>TPROXY Port</label></td>
			<td class="td left"><input type="text" id="db_tproxy_port" class="cbi-input-text" style="width:150px"></td></tr>

		<tr class="tr"><td class="td left"><label>fwmark</label></td>
			<td class="td left"><input type="text" id="db_fwmark" class="cbi-input-text" style="width:150px"></td></tr>

		<tr class="tr"><td class="td left"><label>self_mark (default_mark di config sing-box)</label></td>
			<td class="td left"><input type="text" id="db_self_mark" class="cbi-input-text" style="width:150px"></td></tr>

		<tr class="tr"><td class="td left"><label>Routing Table</label></td>
			<td class="td left"><input type="text" id="db_rtable" class="cbi-input-text" style="width:150px"></td></tr>
	</table>
</div>

<div class="cbi-section">
	<h3>Dashboard (clash_api)</h3>
	<table class="table" style="max-width:700px">
		<tr class="tr"><td class="td left" style="width:280px"><label>Dashboard Port</label></td>
			<td class="td left"><input type="text" id="db_dashboard_port" class="cbi-input-text" style="width:150px"></td></tr>

		<tr class="tr"><td class="td left"><label>Dashboard Directory (external_ui)</label></td>
			<td class="td left"><input type="text" id="db_dashboard_dir" class="cbi-input-text" style="width:100%"></td></tr>
	</table>
</div>

<div class="cbi-page-actions">
	<button class="cbi-button cbi-button-save" onclick="dbSaveSettings()">Save</button>
	<span id="db_settings_info" style="margin-left:12px; font-weight:bold"></span>
</div>

<script type="text/javascript">
	var dbUrl = {
		cfgGet:      '<%=luci.dispatcher.build_url("admin/services/danbox/config_get")%>',
		cfgSaveOnly: '<%=luci.dispatcher.build_url("admin/services/danbox/config_save_only")%>'
	};

	function dbLoadSettings() {
		fetch(dbUrl.cfgGet, {cache:'no-store'})
		.then(function(r) { return r.json(); })
		.then(function(d) {
			document.getElementById('db_tproxy_port').value = d.tproxy_port;
			document.getElementById('db_fwmark').value = d.fwmark;
			document.getElementById('db_self_mark').value = d.self_mark;
			document.getElementById('db_rtable').value = d.rtable;
			document.getElementById('db_dashboard_port').value = d.dashboard_port;
			document.getElementById('db_dashboard_dir').value = d.dashboard_dir;
		});
	}

	function dbSaveSettings() {
		var info = document.getElementById('db_settings_info');
		info.style.color = '#58a6ff';
		info.textContent = 'Menyimpan pengaturan...';

		var body = new FormData();
		body.append('tproxy_port', document.getElementById('db_tproxy_port').value);
		body.append('fwmark', document.getElementById('db_fwmark').value);
		body.append('self_mark', document.getElementById('db_self_mark').value);
		body.append('rtable', document.getElementById('db_rtable').value);
		body.append('dashboard_port', document.getElementById('db_dashboard_port').value);
		body.append('dashboard_dir', document.getElementById('db_dashboard_dir').value);

		fetch(dbUrl.cfgSaveOnly, {method:'POST', body:body})
		.then(function(r) { return r.json(); })
		.then(function(d) {
			if (!d.ok) {
				info.style.color = '#ff7b72';
				info.textContent = 'Gagal menyimpan pengaturan.';
				return;
			}

			info.style.color = '#3fb950';
			info.textContent = 'Pengaturan berhasil disimpan. (Service tidak di-restart)';
		})
		.catch(function() {
			info.style.color = '#ff7b72';
			info.textContent = 'Tidak dapat menghubungi service controller.';
		});
	}

	dbLoadSettings();
</script>

<%+footer%>
