<%+header%>

<h2 name="content">DanBox - Log</h2>
<div class="cbi-map-descr">
	<b>App Log</b>: tahapan service (start/stop, validasi, nftables). &nbsp;
	<b>Core Log</b>: output mentah dari proses sing-box sendiri (error runtime, FATAL, dll).
	Keduanya direset hanya saat service benar-benar di-start. Tidak auto-refresh terus-menerus — tekan Refresh Now.
</div>

<div class="cbi-section">
	<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px">
		<div>
			<button class="cbi-button cbi-button-apply" id="db_tab_app" onclick="dbSwitchTab('app')">App Log</button>
			<button class="cbi-button" id="db_tab_core" onclick="dbSwitchTab('core')">Core Log</button>
			<button class="cbi-button" style="margin-left:12px" onclick="dbLoadLog()">Refresh Now</button>
			<label style="margin-left:12px"><input type="checkbox" id="db_autoscroll" checked> Auto-scroll saat refresh</label>
		</div>
		<div id="db_log_meta" style="color:#888; font-size:12px"></div>
	</div>

	<div id="db_log_box" style="background:#0d1117; color:#c9d1d9; font-family:monospace; font-size:13px; line-height:1.6; height:600px; overflow-y:auto; border-radius:8px; padding:14px; border:1px solid #30363d"></div>
</div>

<script type="text/javascript">
	var dbLogUrl = '<%=luci.dispatcher.build_url("admin/services/danbox/log_data")%>';
	var dbCurrentTab = 'app';

	function dbEscapeHtml(s) {
		return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
	}
	// buang kode warna ANSI mentah dari output sing-box (mis. ESC[31mFATAL...ESC[0m)
	function dbStripAnsi(s) {
		return String(s).replace(/\x1b\[[0-9;]*m/g, '');
	}

	function dbRenderLine(line) {
		var style = 'padding:2px 0';
		if (/fatal|panic:|gagal|error/i.test(line)) {
			style += ';color:#ff7b72;font-weight:bold';
		} else if (/berhasil|selesai|valid|lolos|terpasang/i.test(line)) {
			style += ';color:#3fb950';
		} else if (/^\d{4}-\d\d-\d\d .*=== /.test(line)) {
			style += ';color:#58a6ff;font-weight:bold;margin-top:8px';
		} else {
			style += ';color:#c9d1d9';
		}
		return '<div style="' + style + '">' + dbEscapeHtml(line) + '</div>';
	}

	function dbSwitchTab(tab) {
		dbCurrentTab = tab;
		document.getElementById('db_tab_app').className = 'cbi-button' + (tab === 'app' ? ' cbi-button-apply' : '');
		document.getElementById('db_tab_core').className = 'cbi-button' + (tab === 'core' ? ' cbi-button-apply' : '');
		dbLoadLog();
	}

	function dbLoadLog() {
		fetch(dbLogUrl + '?type=' + dbCurrentTab).then(r => r.json()).then(function(d) {
			var box = document.getElementById('db_log_box');
			var lines = (d.log || '').split('\n').map(dbStripAnsi).filter(function(l) { return l.length > 0; });
			box.innerHTML = lines.length ? lines.map(dbRenderLine).join('') : '<div style="color:#888">(log kosong)</div>';
			document.getElementById('db_log_meta').textContent = (dbCurrentTab === 'app' ? 'App Log' : 'Core Log') + ' \u00b7 ' + lines.length + ' baris \u00b7 dimuat ' + new Date().toLocaleTimeString();
			if (document.getElementById('db_autoscroll').checked) {
				box.scrollTop = box.scrollHeight;
			}
		});
	}

	dbSwitchTab('app');
</script>

<%+footer%>
