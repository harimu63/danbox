name: Build luci-app-danbox

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      # LUCI_PKGARCH:=all -> no native code, so ANY SDK target produces
      # a valid, universal .ipk. x86_64 SDK is used purely because it's
      # the fastest/smallest to download and build with.
      - name: Download OpenWrt SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
          wget -q "$SDK_URL" -O sdk.tar.xz
          mkdir sdk && tar -xJf sdk.tar.xz -C sdk --strip-components=1

      - name: Prepare feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Link package into SDK
        run: |
          mkdir -p sdk/package/luci-app-danbox
          cp -r Makefile luasrc root sdk/package/luci-app-danbox/

      - name: Build package
        working-directory: sdk
        run: |
          make defconfig
          make package/luci-app-danbox/compile V=s -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-danbox
          path: sdk/bin/packages/**/luci-app-danbox*.ipk
